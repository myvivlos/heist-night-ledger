<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIGHT LEDGER — Top-Down Stealth Heist</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #060a13;
      color: #f8fafc;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      background: #070b14;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
